<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">~/.config/fontconfig/nerd-font-symbols.conf</include>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>Consolas</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="family" mode="append" binding="strong"><string>LXGW ZhenKai Slab GB</string></edit>
  </match>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Consolas</family>
      <family>Symbols Nerd Font Mono</family>
      <family>LXGW WenKai Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>Consolas</family>
    <prefer>
      <family>Consolas</family>
      <family>Symbols Nerd Font Mono</family>
      <family>LXGW WenKai Mono</family>
    </prefer>
  </alias>
</fontconfig>
