sync:
  defaults:
    mode: two-way-resolved
    ignore:
      paths:
        - "**/*.swp"
        - "**/*.swo"
        - "**/*.swn"
        - "**/*~"
        - "**/.DS_Store"
        - "**/Thumbs.db"
        - "**/desktop.ini"
        - "**/*.pyc"
        - "**/__pycache__"
        - "**/.venv"
        - "**/venv"
        - "**/.mypy_cache"
        - "**/.pytest_cache"
        - "**/.ruff_cache"
        - "**/.tox"
        - "**/node_modules"
        - "**/bower_components"
        - "**/.next"
        - "**/.nuxt"
        - "**/.turbo"
        - "**/target"
        - "**/.gradle"
        - "**/.idea"
        - "**/.cache"
        - "**/dist"
        - "**/build"
        - "**/out"
        - "**/*.log"
        - "**/*.tmp"
